<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新州导航站 · 相关文件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            background-image: url('PICTURE/bj.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 215, 0, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 215, 0, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 820px;
            width: 100%;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 48px;
            padding: 3rem 3rem 2.5rem;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 215, 0, 0.04) inset;
            min-height: 300px;
        }

        /* 返回链接 */
        .back-link {
            display: block;
            margin-bottom: 1.5rem;
        }
        .back-link h2 {
            margin: 0;
            font-size: 1.8rem;      /* 约等于h2大小，可根据需要调整 */
            font-weight: bold;
        }
        .back-link a {
            color: #ffffff;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: none;   /* 悬停无下划线 */
        }

        @media (max-width: 640px) {
            .card {
                padding: 2rem 1.4rem;
                border-radius: 32px;
                min-height: 200px;
            }
            .back-link h2 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 420px) {
            .card {
                padding: 1.5rem 1rem;
                border-radius: 24px;
                min-height: 150px;
            }
            .back-link h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="back-link">
            <h2><a href="https://lem6684.github.io/Xinzhou/">&lt; 返回</a></h2>
        </div>
        <!-- 在此处添加其他内容 -->
    </div>
</body>
</html>
